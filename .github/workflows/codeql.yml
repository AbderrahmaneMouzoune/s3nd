name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a query added upstream reaches code nobody has touched.
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # TypeScript is covered by javascript-typescript; actions checks the
        # workflows themselves (injection through a pull request title, an
        # untrusted checkout with write permissions).
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@v7

      # No build: CodeQL extracts TypeScript from source.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
