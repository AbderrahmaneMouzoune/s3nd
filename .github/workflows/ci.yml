name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-convention:
    name: Conventional pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Pull requests are squash-merged, so this title becomes the commit message
      # on main — the one release-please reads to decide the next version.
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          TYPES='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'

          if printf '%s' "$TITLE" | grep -qE "^($TYPES)(\([a-z0-9._/-]+\))?!?: .+"; then
            echo "OK: $TITLE"
          else
            echo "The pull request title is not a conventional commit:"
            echo ""
            echo "  $TITLE"
            echo ""
            echo "Use '<type>[optional scope][!]: <description>', for example:"
            echo "  feat: presign browser uploads"
            echo "  fix(snapshots): honour expiresAt on read"
            echo "  feat!: drop the callback form of getUrl"
            echo ""
            echo "Types: $TYPES. 'feat' and 'fix' release, the others do not."
            exit 1
          fi

  quality:
    name: Lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # bun installs and orchestrates, but the toolchain still runs on Node:
      # tsup, eslint and next all ship Node shebangs.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Turborepo's own cache, carried between runs. Without it every push
      # rebuilds all four Next.js apps from scratch, even when the change was
      # a README. Turbo still hashes every input, so a restored entry is only
      # reused when the inputs are identical.
      - name: Restore the turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-quality-${{ github.sha }}
          restore-keys: turbo-quality-

      - run: bun install --frozen-lockfile

      - run: bun run format:check

      - run: bun run lint

      # Exports nothing imports, dependencies nothing uses, files nothing
      # reaches, in the four packages. Run before the build so it reads the
      # source, not dist.
      - run: bun run knip

      # Also checks the type tests (test/types.test.ts*), which are assertions
      # for tsc rather than for vitest.
      - run: bun run type-check

      - run: bun run build

  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # This is the point of the matrix: these packages are published for
      # Node, so the suites have to run on Node. `.bin/vitest` carries a
      # `#!/usr/bin/env node` shebang, so it picks up whichever version this
      # step installed — bun only resolves the dependency tree.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore the turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-test-node${{ matrix.node-version }}-${{ github.sha }}
          restore-keys: turbo-test-node${{ matrix.node-version }}-

      - run: bun install --frozen-lockfile

      - run: bunx turbo test

  packages:
    name: What ships to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # The four published packages only, as in release.yml: none of the apps
      # ends up in a tarball.
      - run: bun install --frozen-lockfile --filter './packages/*' --filter .

      # No turbo cache in this job: what gets checked is built from this
      # checkout, like the dist a release publishes.
      - run: bunx turbo build --filter='./packages/*'

      # publint reads package.json against the packed files; attw resolves the
      # types under node10, node16 (CJS and ESM) and bundler.
      - run: bun run lint:packages

      - name: Install the tarballs in an empty project
        run: bun run smoke-test

      - name: Coverage on core and protocol
        run: bunx turbo test:coverage --filter=@s3nd/core --filter=@s3nd/protocol
