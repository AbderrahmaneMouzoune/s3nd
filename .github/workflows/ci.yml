name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-convention:
    name: Conventional pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Pull requests are squash-merged, so this title becomes the commit message
      # on main — the one release-please reads to decide the next version.
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          TYPES='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'

          if printf '%s' "$TITLE" | grep -qE "^($TYPES)(\([a-z0-9._/-]+\))?!?: .+"; then
            echo "OK: $TITLE"
          else
            echo "The pull request title is not a conventional commit:"
            echo ""
            echo "  $TITLE"
            echo ""
            echo "Use '<type>[optional scope][!]: <description>', for example:"
            echo "  feat: presign browser uploads"
            echo "  fix(snapshots): honour expiresAt on read"
            echo "  feat!: drop the callback form of getUrl"
            echo ""
            echo "Types: $TYPES. 'feat' and 'fix' release, the others do not."
            exit 1
          fi

  quality:
    name: Lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # bun installs and orchestrates, but the toolchain still runs on Node:
      # tsup, eslint and next all ship Node shebangs.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Turborepo's own cache, carried between runs. Without it every push
      # rebuilds all four Next.js apps from scratch, even when the change was
      # a README. Turbo still hashes every input, so a restored entry is only
      # reused when the inputs are identical.
      - name: Restore the turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-quality-${{ github.sha }}
          restore-keys: turbo-quality-

      - run: bun install --frozen-lockfile

      - run: bun run format:check

      - run: bun run lint

      - run: bun run type-check

      - run: bun run build

      # Reads the declarations the build just emitted, and fails when a
      # package's public surface no longer matches its committed
      # etc/*.api.md. Run `bun run api:update` and commit the diff.
      - run: bun run api

  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # This is the point of the matrix: these packages are published for
      # Node, so the suites have to run on Node. `.bin/vitest` carries a
      # `#!/usr/bin/env node` shebang, so it picks up whichever version this
      # step installed — bun only resolves the dependency tree.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore the turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-test-node${{ matrix.node-version }}-${{ github.sha }}
          restore-keys: turbo-test-node${{ matrix.node-version }}-

      - run: bun install --frozen-lockfile

      - run: bunx turbo test

  integration:
    name: Integration against MinIO
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # MinIO no longer publishes community images or binaries, so it is built
      # from source at a pinned commit and cached; the runner ships Go.
      MINIO_VERSION: v0.0.0-20260212201848-7aac2a2c5b7c
      S3ND_TEST_ENDPOINT: http://127.0.0.1:9000
      S3ND_TEST_ACCESS_KEY: minioadmin
      S3ND_TEST_SECRET_KEY: minioadmin

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore the MinIO build
        id: minio-cache
        uses: actions/cache@v6
        with:
          path: ~/go/bin/minio
          key: minio-${{ runner.os }}-${{ env.MINIO_VERSION }}

      - name: Build MinIO
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: GOTOOLCHAIN=auto go install "github.com/minio/minio@${MINIO_VERSION}"

      # Started in a step rather than as a service container: a service
      # cannot take the `server` command MinIO needs.
      - name: Start MinIO
        env:
          MINIO_ROOT_USER: ${{ env.S3ND_TEST_ACCESS_KEY }}
          MINIO_ROOT_PASSWORD: ${{ env.S3ND_TEST_SECRET_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/minio"
          nohup ~/go/bin/minio server "$RUNNER_TEMP/minio" --address 127.0.0.1:9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS "$S3ND_TEST_ENDPOINT/minio/health/live" && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/minio.log"
          exit 1

      - run: bun install --frozen-lockfile

      - run: bunx turbo run test:integration --filter=@s3nd/core

  runtimes:
    name: Handler on Bun and Deno
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: bun install --frozen-lockfile

      # The smoke test imports the built bundle, which is what has to run
      # outside Node, against an in-memory S3.
      - run: bunx turbo build --filter=@s3nd/core

      - name: Bun
        working-directory: packages/s3nd
        run: bun smoke/handler.mjs

      - name: Deno
        working-directory: packages/s3nd
        run: deno run --allow-env --allow-read smoke/handler.mjs
