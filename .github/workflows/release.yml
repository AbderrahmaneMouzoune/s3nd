name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the version currently on main to npm, without waiting for a new release'
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-please:
    name: Prepare the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      # Which package directories this release covers, as a JSON array. Only
      # those get published; the rest are untouched.
      paths: ${{ steps.release.outputs.paths_released }}

    steps:
      # Keeps a release pull request open with the next version and the changelog
      # entry it would ship, both derived from the conventional commits on main.
      # Merging that pull request is what tags the version and creates the GitHub
      # release, which is when the publish job below runs.
      #
      # RELEASE_PLEASE_TOKEN is optional: a personal access token with `contents`
      # and `pull-requests` write access makes CI run on the release pull request.
      # GitHub does not trigger workflows on pull requests opened with the default
      # GITHUB_TOKEN, so without it the release pull request shows no checks.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.released == 'true' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # npm, not bun, does the publishing below: provenance is minted from the
      # OIDC token npm exchanges with the registry.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10, which publishes with a token but cannot publish
      # through OIDC at all: npm trusted publishing needs 11.5.1 or newer.
      - name: Use an npm new enough to publish through OIDC
        run: npm install --global npm@latest

      # Only the four published packages, here and in every step below. The
      # docs site, the website, the examples and the drop template are part of
      # this workspace but none of them ends up in a tarball, and building them
      # was about fifty seconds of Next.js on every release. `--filter .` keeps
      # the root devDependencies, which is where turbo and eslint live.
      - run: bun install --frozen-lockfile --filter './packages/*' --filter .

      - run: bunx turbo lint --filter='./packages/*'

      - run: bunx turbo type-check --filter='./packages/*'

      - run: bunx turbo test --filter='./packages/*'

      # Deliberately uncached, unlike CI: what goes to the registry is built
      # here, from this checkout, and never restored from an earlier run.
      - run: bunx turbo build --filter='./packages/*'

      # NPM_TOKEN has to be a granular access token with 2FA bypass enabled;
      # npm turns anything else down with a 403 on an account that has two
      # factor authentication. Or drop NODE_AUTH_TOKEN entirely, configure
      # this repository as a trusted publisher on npm, and publish through
      # OIDC — no token, and so no 2FA to answer for.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASED_PATHS: ${{ needs.release-please.outputs.paths }}
        run: |
          set -euo pipefail

          # Dependencies before dependents, so a package is never on the
          # registry before something it needs.
          ORDER='packages/protocol packages/s3nd packages/react packages/cli'

          if [ -n "${RELEASED_PATHS:-}" ] && [ "$RELEASED_PATHS" != '[]' ]; then
            selected=$(printf '%s' "$RELEASED_PATHS" | jq -r '.[]')
          else
            # Reached through the manual "Publish" input, which republishes
            # whatever versions are currently on main.
            selected=$(printf '%s\n' $ORDER)
          fi

          for path in $ORDER; do
            if printf '%s\n' "$selected" | grep -qx "$path"; then
              name=$(jq -r .name "$path/package.json")
              version=$(jq -r .version "$path/package.json")

              # The manual "Publish" input republishes whatever is on main,
              # which usually includes versions already on the registry. npm
              # answers those with a 403, and `set -e` would take the rest of
              # the loop down with it — including packages that do need going.
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "$name@$version is already on npm, skipping"
                continue
              fi

              echo "::group::Publishing $name@$version"
              (cd "$path" && npm publish --provenance --access public)
              echo '::endgroup::'
            fi
          done
